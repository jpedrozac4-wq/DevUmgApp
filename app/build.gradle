plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'gt.com.ro.devumgapp'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "gt.com.ro.devumgapp"
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName "1.0.0-beta.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // REST backend configuration
        buildConfigField "String", "BASE_URL", "\"https://api-sgau-backend-746899482768.us-central1.run.app/\""
        // Display version dynamically from versionName (guide pattern)
        resValue "string", "app_version", "\"Versión ${versionName}\""
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        resValues = true
        buildConfig = true
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.cardview
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp
    implementation libs.logging.interceptor
    implementation libs.firebase.firestore
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
