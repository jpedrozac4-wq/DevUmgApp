plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

// --- Automatic versioning ----------------------------------------------------
// versionCode = 100 + commits reachable from HEAD, and versionName keeps the
// beta convention as beta.<commit count>.
//
// Why the 100 offset: the previously published versionCode values are small
// (1..N) and the in-app update check compares `firebaseVersionCode >
// currentVersionCode`. A commit count only grows on a released branch, so
// 100 + count stays above every published version with no manual bump.
//
// Why providers.exec: the configuration cache is enabled (gradle.properties)
// and providers.exec is tracked as a build input. project.exec was removed in
// Gradle 9, and Runtime.exec would not be recorded as an input at all.
def commitCount
try {
    commitCount = providers.exec {
        commandLine 'git', 'rev-list', '--count', 'HEAD'
        workingDir rootDir
    }.standardOutput.asText.get().trim().toInteger()
} catch (Exception e) {
    // Fail loudly: a silent low fallback would ship an APK that cannot be
    // installed over an already published version.
    throw new GradleException(
            "Cannot derive versionCode: 'git rev-list --count HEAD' failed " +
            "(${e.message}). Build from a git clone with full history.", e)
}

def appVersionCode = 100 + commitCount
def appVersionName = "1.0.0-beta.${commitCount}"

android {
    namespace 'gt.com.ro.devumgapp'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "gt.com.ro.devumgapp"
        minSdk 29
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // REST backend configuration
        buildConfigField "String", "BASE_URL", "\"https://api-sgau-backend-746899482768.us-central1.run.app/\""
        // Display version dynamically from versionName (guide pattern)
        resValue "string", "app_version", "\"Versión ${versionName}\""
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        resValues = true
        buildConfig = true
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.cardview
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp
    implementation libs.logging.interceptor
    implementation libs.firebase.firestore
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
